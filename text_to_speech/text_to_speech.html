<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sensual TTS Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 450px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 15px;
      padding: 10px;
      box-sizing: border-box;
    }
    .control-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    select, input[type="range"], button {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      background-color: #4A90E2;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #357ABD;
    }
  </style>
</head>
<body>

  <h2>Text to Speech</h2>

  <div class="control-group">
    <label for="text">Text:</label>
    <textarea id="text" placeholder="Enter text here...">Hello... take a deep breath, and relax.</textarea>
  </div>

  <div class="control-group">
    <label for="voiceSelect">Voice:</label>
    <select id="voiceSelect"></select>
  </div>

  <div class="control-group">
    <label for="rate">Speed (<span id="rateVal">0.80</span>x):</label>
    <input type="range" id="rate" min="0.5" max="1.5" step="0.05" value="0.80">
  </div>

  <div class="control-group">
    <label for="pitch">Pitch (<span id="pitchVal">0.85</span>):</label>
    <input type="range" id="pitch" min="0.5" max="1.5" step="0.05" value="0.85">
  </div>

  <button onclick="speak()">Speak</button>

  <script>
    const voiceSelect = document.getElementById('voiceSelect');
    const rateInput = document.getElementById('rate');
    const pitchInput = document.getElementById('pitch');
    const rateVal = document.getElementById('rateVal');
    const pitchVal = document.getElementById('pitchVal');

    let voices = [];

    // Update label displays when sliders move
    rateInput.addEventListener('input', () => rateVal.textContent = parseFloat(rateInput.value).toFixed(2));
    pitchInput.addEventListener('input', () => pitchVal.textContent = parseFloat(pitchInput.value).toFixed(2));

    function populateVoiceList() {
      voices = window.speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';

      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.setAttribute('data-index', index);

        // Auto-select common female system voices if detected
        const name = voice.name.toLowerCase();
        if (name.includes('zira') || name.includes('samantha') || name.includes('jenny') || name.includes('female')) {
          option.selected = true;
        }

        voiceSelect.appendChild(option);
      });
    }

    // Populate list (handles async loading in Chrome)
    window.speechSynthesis.onvoiceschanged = populateVoiceList;
    populateVoiceList();

    function speak() {
      // Cancel any ongoing speech before starting a new one
      window.speechSynthesis.cancel();

      const text = document.getElementById('text').value;
      if (!text) return;

      const utterance = new SpeechSynthesisUtterance(text);
      const selectedIndex = voiceSelect.selectedOptions[0]?.getAttribute('data-index');

      if (selectedIndex !== null && voices[selectedIndex]) {
        utterance.voice = voices[selectedIndex];
      }

      utterance.rate = parseFloat(rateInput.value);
      utterance.pitch = parseFloat(pitchInput.value);

      window.speechSynthesis.speak(utterance);
    }
  </script>

</body>
</html>
